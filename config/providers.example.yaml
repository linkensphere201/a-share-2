providers:
  default: tushare
  tushare:
    enabled: true
    token_env: TUSHARE_TOKEN
    env_file: ../.env
    requests_per_minute: 300
    retries: 4
    retry_wait_seconds: 15
    backoff_multiplier: 2
    api_url: http://api.waditu.com/dataapi
    timeout_seconds: 30
  auto_update:
    enabled: true
    poll_interval_seconds: 900
    calendar_lookback_days: 14
  intraday:
    enabled: true
    poll_interval_seconds: 30
    request_timeout_seconds: 8
    stale_after_seconds: 90
    circuit_breaker_failures: 3
    circuit_breaker_seconds: 60
    max_symbols: 1000
  futures:
    # Futures remain opt-in until Provider contracts, storage migration, and acceptance pass.
    enabled: false
    enabled_exchanges: [CFFEX, DCE, CZCE, SHFE, INE, GFEX]
    history_start: 1990-01-01
    correction_window_trading_days: 5
    # Conservative Provider-availability thresholds, not exchange close times.
    final_data_cutoffs:
      CFFEX: "18:00"
      DCE: "18:00"
      CZCE: "18:00"
      SHFE: "18:00"
      INE: "18:00"
      GFEX: "18:00"
    canonical:
      enabled: true
      provider: tushare
      token_env: TUSHARE_TOKEN
      env_file: ../.env
      requests_per_minute: 120
      timeout_seconds: 30
      retries: 4
      retry_wait_seconds: 15
      backoff_multiplier: 2
      api_url: http://api.waditu.com/dataapi
    provisional:
      enabled: true
      provider: akshare
      request_timeout_seconds: 8
      retries: 1
      retry_wait_seconds: 1
      refresh_interval_seconds: 30
      stale_after_seconds: 90
      max_contracts: 50
      # Keep unset until futures_zh_realtime passes M6.2.6 parity tests.
      fallback_provider:
      # Day sessions have conservative built-in defaults. Night sessions are
      # product-specific and must be declared explicitly from current exchange rules.
      sessions:
        CFFEX:
          "*": {day: []}
          IF: {day: ["09:30-11:30", "13:00-15:00"]}
          IH: {day: ["09:30-11:30", "13:00-15:00"]}
          IC: {day: ["09:30-11:30", "13:00-15:00"]}
          IM: {day: ["09:30-11:30", "13:00-15:00"]}
          T: {day: ["09:30-11:30", "13:00-15:15"]}
          TF: {day: ["09:30-11:30", "13:00-15:15"]}
          TS: {day: ["09:30-11:30", "13:00-15:15"]}
          TL: {day: ["09:30-11:30", "13:00-15:15"]}
        SHFE:
          "*": {day: ["09:00-10:15", "10:30-11:30", "13:30-15:00"]}
          CU:
            night: ["21:00-01:00"]
          AU:
            night: ["21:00-02:30"]
          RB:
            night: ["21:00-23:00"]
        DCE:
          "*": {day: ["09:00-10:15", "10:30-11:30", "13:30-15:00"]}
          A:
            night: ["21:00-23:00"]
        CZCE:
          "*": {day: ["09:00-10:15", "10:30-11:30", "13:30-15:00"]}
          CF:
            night: ["21:00-23:00"]
        INE:
          "*": {day: ["09:00-10:15", "10:30-11:30", "13:30-15:00"]}
          SC:
            night: ["21:00-02:30"]
        GFEX:
          "*": {day: ["09:00-10:15", "10:30-11:30", "13:30-15:00"]}
  etf_holdings:
    enabled: true
    # Startup stays bounded; the dedicated sync command can fill the entire ETF catalog.
    max_symbols_per_run: 25
    lookback_open_dates: 5
  universes:
    # Keep one active, liquid, established representative for each exposure.
    etfs:
      - { symbol: 510050.SH, category: broad, reason: established Shanghai 50 tracker }
      - { symbol: 510300.SH, category: broad, reason: established CSI 300 tracker }
      - { symbol: 510500.SH, category: broad, reason: established CSI 500 tracker }
      - { symbol: 512100.SH, category: broad, reason: established CSI 1000 tracker }
      - { symbol: 588000.SH, category: broad, reason: established STAR 50 tracker }
      - { symbol: 159915.SZ, category: broad, reason: established ChiNext tracker }
      - { symbol: 512480.SH, category: sector, reason: representative semiconductor tracker }
      - { symbol: 512880.SH, category: sector, reason: representative securities tracker }
      - { symbol: 512800.SH, category: sector, reason: representative bank tracker }
      - { symbol: 512170.SH, category: sector, reason: representative medical-services tracker }
      - { symbol: 512010.SH, category: sector, reason: representative pharmaceutical tracker }
      - { symbol: 515030.SH, category: sector, reason: representative new-energy vehicle tracker }
      - { symbol: 515790.SH, category: sector, reason: representative photovoltaic tracker }
      - { symbol: 512660.SH, category: sector, reason: representative defense tracker }
      - { symbol: 512690.SH, category: sector, reason: representative liquor tracker }
      - { symbol: 512200.SH, category: sector, reason: representative real-estate tracker }
      - { symbol: 512400.SH, category: sector, reason: representative nonferrous-metals tracker }
      - { symbol: 515220.SH, category: sector, reason: representative coal tracker }
      - { symbol: 159928.SZ, category: sector, reason: representative consumer-staples tracker }
      - { symbol: 512980.SH, category: sector, reason: representative media tracker }
      - { symbol: 512720.SH, category: sector, reason: representative computer tracker }
      - { symbol: 515050.SH, category: sector, reason: representative 5G tracker }
      - { symbol: 516510.SH, category: sector, reason: representative cloud-computing tracker }
    broad_indices:
      - { symbol: 000001.SH, category: composite, reason: Shanghai Composite benchmark }
      - { symbol: 399001.SZ, category: composite, reason: Shenzhen Component benchmark }
      - { symbol: 000016.SH, category: broad, reason: Shanghai 50 benchmark }
      - { symbol: 000300.SH, category: broad, reason: CSI 300 benchmark }
      - { symbol: 000905.SH, category: broad, reason: CSI 500 benchmark }
      - { symbol: 000852.SH, category: broad, reason: CSI 1000 benchmark }
      - { symbol: 932000.CSI, category: broad, reason: CSI 2000 benchmark }
      - { symbol: 000688.SH, category: growth, reason: STAR 50 benchmark }
      - { symbol: 399006.SZ, category: growth, reason: ChiNext benchmark }
      - { symbol: 399673.SZ, category: growth, reason: ChiNext 50 benchmark }
    sector_source: SW2021
    sector_level: L1
  validation:
    providers:
      - akshare
      - baostock
    sample_symbols:
      - 000001.SZ
      - 000002.SZ
      - 600000.SH
    price_abs_tolerance: 0.001
    volume_rel_tolerance: 0.001
  repair:
    enabled: true
    universe_provider: baostock
    fallback_providers:
      - akshare_eastmoney
      - akshare_sina
    max_dates_per_run: 1
