[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "stock-harness"
version = "0.1.0"
description = "Performance-first local stock visualization data service"
requires-python = ">=3.12,<3.15"
dependencies = [
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
benchmark = ["duckdb>=1.5", "polars>=1.40"]
validation = ["akshare>=1.17", "baostock>=0.8.9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
